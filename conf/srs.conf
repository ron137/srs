    enabled             on;

    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    6;
        hls_window      1800;
        hls_cleanup     on;
        hls_dispose     0;
        hls_m3u8_file   live/[stream]/480p.m3u8;
        hls_ts_file     live/[stream]/480p-[seq].ts;
    }
