version: "3.9"
services:
    api:
        build: "./callbackServer"
        ports:
            - "8085:8085"
    http_server:
        build: "./hlswatch"
        ports:
            - "80:80"
        volumes:
            - ${PWD}/configs/hlswatch.conf:/etc/hlswatch.conf
            - ${PWD}/configs/http_server_nginx.conf:/etc/nginx/nginx.conf
            - hls_path:/tmp/hls/
            - ${PWD}/http_server/live/master.m3u8:/tmp/hls/live/master.m3u8
    live:
        image: "ossrs/srs:3"
        ports:
            - "1935:1935"
            - "1985:1985"
            - "8080:8080"
        volumes:
            - ${PWD}/configs/srs.conf:/usr/local/srs/conf/srs.conf
            - hls_path:/usr/local/srs/objs/nginx/html
        depends_on:
            - api
            - http_server
        extra_hosts:
            - "stream-1080p:127.0.1.2"
            - "stream-720p:127.0.1.3"
            - "stream-360p:127.0.1.4"
    player:
        build: "./plyr"
        ports:
            - "3000:3000"
volumes:
    hls_path:

