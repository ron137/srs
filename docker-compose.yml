version: "3.9"
services:
    api:
        build: "./callbackServer"
        ports:
            - "8085:8085"
    live:
        build: "./live"
        ports:
            - "1935:1935"
            - "1985:1985"
            - "8080:8080"
        volumes:
            - ${PWD}/conf/srs.conf:/usr/local/srs/conf/srs.conf
            # - ${PWD}/srs.log:/usr/local/srs/objs/srs.log
        depends_on:
            - api
        extra_hosts:
            - "stream-720p:127.0.1.2"
            - "stream-480p:127.0.1.3"
    player:
        build: "./plyr"
        ports:
            - "3000:3000"

