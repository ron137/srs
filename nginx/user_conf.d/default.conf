server {
    # Listen to port 443 on both IPv4 and IPv6.
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;

    # Domain names this server should respond to.
    server_name live.hbhstreaming.com;

    # Load the certificate files.
    ssl_certificate         /etc/letsencrypt/live/live.hbhstreaming.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/live.hbhstreaming.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/live.hbhstreaming.com/chain.pem;

    # Load the Diffie-Hellman parameter.
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    location /hls {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://localhost:8081;
    }


    location / {
        proxy_pass http://localhost:3000/;
    }
}
